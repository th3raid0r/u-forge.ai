# Matched Strix Halo example. See docs/inference-fabric.md for setup and calibration.
runtime_version = "2026.48.3"
hardware = "AMD Ryzen AI Max+ 395 / Radeon 8060S / XDNA2"
fabric = "unified"
power_profile = "performance"
power_profile_path = "/sys/firmware/acpi/platform_profile"
ac_online_path = "/sys/class/power_supply/ACAD/online"
ac_online = true
temperature_path = "/sys/class/hwmon/hwmon5/temp1_input" # Confirm k10temp Tctl on this boot.
temperature_band_c = [32.0, 45.0]
cooldown_secs = 10
repetitions = 5
chunks = 1024  # Use 32 for the same-work one-engine-batch vs partitioned-overlap case.
interactive_period_ms = 50
max_loaded_models = 2
# whole_system_joules_path = "/path/to/wall-meter-cumulative-joules"
concurrent = ["cpu", "igpu"]

[embeddings.cpu]
id = "ggml-org/embeddinggemma-300M-GGUF"
checkpoint = "ggml-org/embeddinggemma-300M-GGUF:Q8_0"
artifact = "sha256:b5ce9d77a3fc4b3b39ccb5643c36777911cc4eb46a66962eadfa3f5f60490d63"
precision = "Q8_0"
recipe = "llamacpp"
backend = "cpu"
backend_version = "b12233"
ctx = 2048
threads = 8
parallel = 8
weight = 10

[embeddings.igpu]
id = "fabric/embeddinggemma-igpu" # An alias for the exact same checkpoint; see setup.
checkpoint = "ggml-org/embeddinggemma-300M-GGUF:Q8_0"
artifact = "sha256:b5ce9d77a3fc4b3b39ccb5643c36777911cc4eb46a66962eadfa3f5f60490d63"
precision = "Q8_0"
recipe = "llamacpp"
backend = "vulkan"
backend_version = "b12233"
ctx = 2048
threads = 8
parallel = 8
device = "Vulkan0"
weight = 50

