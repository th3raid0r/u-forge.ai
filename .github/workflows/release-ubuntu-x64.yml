name: Draft Linux x86_64 AppImage release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: u-forge release tag to create
        required: true
        type: string
      source_ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils patchelf \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-xcb-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build u-forge
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: make release V=1

      - name: Verify AppImage artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          artifact="dist/u-forge-${version}-x86_64.AppImage"
          test -x "$artifact"
          (cd dist && sha256sum --check "$(basename "$artifact").sha256")
          "$artifact" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/u-forge
          test -x squashfs-root/usr/lib/u-forge/lemonade/lemond
          test -f squashfs-root/usr/share/u-forge/defaults/config/u-forge.toml
          test -f squashfs-root/usr/share/u-forge/defaults/schemas/Sine\ Nomine/npc.schema.json

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          version=${RELEASE_TAG#v}
          artifact="dist/u-forge-${version}-x86_64.AppImage"
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$SOURCE_REF" \
            --title "u-forge ${RELEASE_TAG}" \
            --generate-notes \
            "$artifact" "$artifact.sha256"
