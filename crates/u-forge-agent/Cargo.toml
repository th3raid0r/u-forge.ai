[package]
name = "u-forge-agent"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
u-forge-core = { path = "../u-forge-core" }
rig = { version = "0.41.0", default-features = false, features = ["agent", "rustls"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
futures = "0.3.33"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.19"
tracing = "0.1.44"
jsonschema = { version = "0.49.4", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
async-trait = "0.1.89"
