[package]
name = "u-forge-ui-gpui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "u_forge_ui_gpui"
path = "src/lib.rs"

[[bin]]
name = "u-forge-ui-gpui"
path = "src/main.rs"

[dependencies]
u-forge-core = { path = "../u-forge-core" }
u-forge-agent = { path = "../u-forge-agent" }
u-forge-graph-view = { path = "../u-forge-graph-view" }
u-forge-ui-traits = { path = "../u-forge-ui-traits" }
gpui = { package = "gpui-ce", version = "0.3.3" }
glam = "0.33.3"
parking_lot = "0.12.5"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tempfile = "3.27.0"
futures = "0.3.33"
anyhow = "1.0.104"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
gpui = { package = "gpui-ce", version = "0.3.3", features = ["test-support"] }

[build-dependencies]
serde_json = "1.0.151"
