[package]
name = "u-forge-core"
version = "0.1.0"
edition = "2024"
description = "Local-first TTRPG worldbuilding tool with AI-powered knowledge graphs"
license = "MIT"
repository = "https://github.com/your-org/u-forge.ai"
keywords = ["ttrpg", "worldbuilding", "ai", "knowledge-graph", "local-first"]
categories = ["games", "text-processing"]

[dependencies]
# Database and storage (SQLite — no C++ compiler required)
rusqlite = { version = "0.40.1", features = ["bundled", "vtab"] }
sqlite-vec = "0.1.9"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt"] }

# Stream combinators (used to drive reqwest byte streams for SSE parsing)
futures = "0.3.33"

# Identifiers
uuid = { version = "1.24.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.19"

# Date/time
chrono = { version = "0.4.45", features = ["serde"] }

# Logging / tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Async traits
async-trait = "0.1.91"

# HTTP client (required for Lemonade Server embedding/reranking API)
reqwest = { version = "0.13.4", features = ["json", "multipart"] }

# OpenAI-compatible client (drives embeddings, TTS, STT — not chat, which deviates from spec)
async-openai = { version = "0.41.3", features = ["embedding", "audio"] }

# Concurrent data structures
dashmap = "6.2.1"
parking_lot = "0.12.5"

# MIME type inference (audio file uploads)
mime_guess = "2.0.5"

# Regular expressions (schema property validation)
regex = "1.13.1"

# Tokenizer (real token counting for chunk splitting and RAG context assembly)
tiktoken-rs = "0.12.0"

# TOML configuration (device config files)
toml = "1.1.4"
toml_edit = "0.25.11"

# Temp directories (tests + examples)
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.5.1", features = ["async_tokio"] }

[[bench]]
name = "inference_lifecycle"
harness = false

[[example]]
name = "convert_memorymesh"
path = "examples/convert_memorymesh.rs"

[[example]]
name = "with_embedded_lemonade"
path = "examples/with_embedded_lemonade.rs"

[features]
default = []
